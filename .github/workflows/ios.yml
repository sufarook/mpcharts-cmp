name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: Compile iOS targets
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Gradle's daemon runs on JDK 25 (gradle/gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Compile the library for iPhone and simulator
        run: ./gradlew :mpchart:compileKotlinIosArm64 :mpchart:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Link the sample framework for the simulator
        run: ./gradlew :sample:shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
